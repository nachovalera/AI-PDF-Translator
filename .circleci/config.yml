version: 2.1

orbs:
  python: circleci/python@3.1.0

jobs:
  build-and-verify:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt
      - run:
          name: Verify project compiles
          command: |
            python -m py_compile app.py ai_pdf_translator/*.py
      - run:
          name: Run unit tests
          command: |
            pytest -q

workflows:
  build:
    jobs:
      - build-and-verify
